# Stack de ESBA para Portainer (hito 12.6). La imagen la define el Dockerfile de
# la raíz; toda la config entra por variables de entorno (12.1, lista completa en
# docs/migracion/hito12-endurecimiento.md).
#
# Secretos: definir ESBA_DB_PASSWORD (y los SMTP_* cuando se configure el correo)
# en la sección "Environment variables" del stack en Portainer — no acá.
#
# Firebird corre en el HOST (decisión heredada del deploy anterior): desde el
# contenedor se llega por host.docker.internal (mapeado abajo al gateway).

services:
  esba:
    # Tag versionado: subilo en cada deploy (1.0.1, 1.0.2, …). Con un tag fijo,
    # Portainer/Docker reutiliza la imagen existente por nombre y no toma el
    # rebuild; cambiar el tag lo obliga a usar la imagen nueva.
    image: esba-web:1.0.2
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "5005:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__Esba: "database=172.17.0.1:/pool/firebird/esba.gdb;user=SYSDBA;password=masterkey;charset=ISO8859_1"
      # DataProtection__KeysPath ya viene en la imagen (=/keys); solo hay que montar el volumen.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Correo por comisión (opcional hasta configurar la cuenta institucional):
      # Smtp__Host: "smtp.gmail.com"
      # Smtp__Port: "587"
      # Smtp__From: "secretaria@esbabarrionorte.edu.ar"
      # Smtp__User: "${ESBA_SMTP_USER}"
      # Smtp__Password: "${ESBA_SMTP_PASSWORD}"
    volumes:
      # Claves de DataProtection (12.1): sin este volumen, cada redeploy invalida
      # las cookies/sesiones de todos los usuarios.
      - esba-keys:/keys

volumes:
  esba-keys:
